name: Moodle 5.2 CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: Moodle 5.2 / PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, intl, mbstring, soap, sodium
          ini-values: max_input_vars=5000
          coverage: none
          tools: composer:v2

      - name: Install Moodle Plugin CI
        run: |
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            moodlehq/moodle-plugin-ci ci '^4.5.10'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and plugin
        run: >-
          moodle-plugin-ci install
          --plugin ./plugin
          --db-host=127.0.0.1
          --no-plugin-node
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: >
          moodle/vendor/bin/phpunit
          --configuration moodle/public/mod/googlemeet/phpunit.xml
          --fail-on-warning
          --display-notices
          --display-phpunit-deprecations

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
