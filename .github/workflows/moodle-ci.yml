name: Moodle 5.2 CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade v2.1.1 / Moodle 5.2 / PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'

    steps:
      - name: Check out plugin with preserved history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: plugin

      - name: Materialize v2.1.1 baseline
        run: >-
          git -C plugin worktree add --detach
          "$GITHUB_WORKSPACE/legacy-plugin"
          4d666bea596ddc035b974b130a3cde7e922d40b2

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, intl, mbstring, soap, sodium
          ini-values: max_input_vars=5000
          coverage: none
          tools: composer:v2

      - name: Install Moodle Plugin CI
        run: |
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            moodlehq/moodle-plugin-ci ci '^4.5.10'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle with v2.1.1
        run: >-
          moodle-plugin-ci install
          --plugin ./legacy-plugin
          --db-host=127.0.0.1
          --no-plugin-node
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: Resolve Moodle CLI paths
        run: |
          if [[ -f "$GITHUB_WORKSPACE/moodle/public/config.php" ]]; then
            echo "MOODLE_CONFIG=$GITHUB_WORKSPACE/moodle/public/config.php" >> "$GITHUB_ENV"
            pluginpath="$GITHUB_WORKSPACE/moodle/public/mod/googlemeet"
          elif [[ -f "$GITHUB_WORKSPACE/moodle/config.php" ]]; then
            echo "MOODLE_CONFIG=$GITHUB_WORKSPACE/moodle/config.php" >> "$GITHUB_ENV"
            pluginpath="$GITHUB_WORKSPACE/moodle/mod/googlemeet"
          else
            echo "Moodle config.php was not found." >&2
            exit 1
          fi
          if [[ -f "$GITHUB_WORKSPACE/moodle/admin/cli/install_database.php" ]] &&
             [[ -f "$GITHUB_WORKSPACE/moodle/admin/cli/upgrade.php" ]]; then
            adminpath="$GITHUB_WORKSPACE/moodle/admin"
          elif [[ -f "$GITHUB_WORKSPACE/moodle/public/admin/cli/install_database.php" ]] &&
               [[ -f "$GITHUB_WORKSPACE/moodle/public/admin/cli/upgrade.php" ]]; then
            adminpath="$GITHUB_WORKSPACE/moodle/public/admin"
          else
            echo "Moodle CLI administration scripts were not found." >&2
            exit 1
          fi
          if [[ ! -e "$pluginpath" ]]; then
            echo "Installed Google Meet plugin path was not found." >&2
            exit 1
          fi
          echo "MOODLE_ADMIN=$(realpath "$adminpath")" >> "$GITHUB_ENV"
          echo "MOODLE_PLUGIN_TARGET=$(realpath "$pluginpath")" >> "$GITHUB_ENV"

      - name: Install the v2.1.1 Moodle database
        run: |
          set -euo pipefail
          adminpass="$(php -r 'echo bin2hex(random_bytes(24)), "Aa1!";')"
          php "$MOODLE_ADMIN/cli/install_database.php" \
            --agree-license \
            --adminpass="$adminpass" \
            --fullname="Google Meet v2.1.1 upgrade rehearsal" \
            --shortname="googlemeet-ci"
          unset adminpass

      - name: Seed v2.1.1 records
        run: php plugin/tests/fixtures/upgrade/seed_v211.php

      - name: Overlay current plugin
        run: rsync -a --delete --exclude='.git' plugin/ "$MOODLE_PLUGIN_TARGET/"

      - name: Run Moodle CLI upgrade
        run: php "$MOODLE_ADMIN/cli/upgrade.php" --non-interactive --allow-unstable

      - name: Verify migrated schema and data
        run: php plugin/tests/fixtures/upgrade/verify_v211.php

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

  phpunit:
    name: Moodle 5.2 / PHP ${{ matrix.php }}
    needs: upgrade
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, intl, mbstring, soap, sodium
          ini-values: max_input_vars=5000
          coverage: none
          tools: composer:v2

      - name: Install Moodle Plugin CI
        run: |
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            moodlehq/moodle-plugin-ci ci '^4.5.10'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and plugin
        run: >-
          moodle-plugin-ci install
          --plugin ./plugin
          --db-host=127.0.0.1
          --no-plugin-node
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Verify protected acceptance gates
        if: ${{ !cancelled() }}
        run: |
          php plugin/tests/fixtures/acceptance/selftest_campaign.php
          php plugin/tests/fixtures/acceptance/validate_environment.php \
            plugin/tests/fixtures/acceptance/environment.example.json

          invalidreadiness="$(mktemp "$RUNNER_TEMP/googlemeet-readiness.XXXXXX.json")"
          cleanup() {
            rm -f -- "$invalidreadiness"
          }
          trap cleanup EXIT
          sed 's/"site_profile": "php83"/"site_profile": "php84"/' \
            plugin/tests/fixtures/acceptance/environment.example.json \
            > "$invalidreadiness"
          if php plugin/tests/fixtures/acceptance/validate_environment.php \
            "$invalidreadiness" 2>/dev/null; then
            echo "The readiness validator accepted a mismatched runtime profile." >&2
            exit 1
          fi

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: >
          moodle/vendor/bin/phpunit
          --configuration moodle/public/mod/googlemeet/phpunit.xml
          --fail-on-notice
          --fail-on-warning
          --display-notices
          --display-phpunit-deprecations

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
