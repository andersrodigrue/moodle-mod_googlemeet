name: Google Workspace environment readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-workspace-readiness
  cancel-in-progress: false

jobs:
  readiness:
    name: Moodle 5.2 / PHP ${{ matrix.php_runtime }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected == true
    runs-on:
      - self-hosted
      - linux
      - google-workspace-acceptance
      - php-${{ matrix.php_runtime }}
    environment: google-workspace-acceptance
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php_runtime:
          - '8.3'
          - '8.4'

    steps:
      - name: Check out the dispatched default-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: plugin

      - name: Validate protected source and local configuration
        env:
          ACCEPTANCE_MOODLE_CONFIG: ${{ vars.MOODLE_CONFIG }}
          EXPECTED_RUNTIME: ${{ matrix.php_runtime }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_RUNTIME" =~ ^8\.(3|4)$ ]]

          checkedout="$(git -C plugin rev-parse HEAD)"
          if [[ "$checkedout" != "$GITHUB_SHA" ]]; then
            echo "The checked-out source does not match the dispatched commit." >&2
            exit 1
          fi

          actualruntime="$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')"
          if [[ "$actualruntime" != "$EXPECTED_RUNTIME" ]]; then
            echo "The runner PHP runtime does not match its protected label." >&2
            exit 1
          fi
          if ! command -v rsync >/dev/null; then
            echo "The dedicated runner does not provide rsync." >&2
            exit 1
          fi
          if [[ -z "$ACCEPTANCE_MOODLE_CONFIG" ]]; then
            echo "The protected environment does not define MOODLE_CONFIG." >&2
            exit 1
          fi

          configpath="$(realpath -- "$ACCEPTANCE_MOODLE_CONFIG")"
          if [[ ! -f "$configpath" ]] ||
             [[ "$(basename -- "$configpath")" != "config.php" ]] ||
             [[ "$configpath" == *$'\n'* ]] ||
             [[ "$configpath" == *$'\r'* ]]; then
            echo "The protected environment MOODLE_CONFIG is invalid." >&2
            exit 1
          fi
          echo "MOODLE_CONFIG=$configpath" >> "$GITHUB_ENV"

      - name: Inspect the disposable Moodle environment
        id: inspect
        env:
          EXPECTED_RUNTIME: ${{ matrix.php_runtime }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          evidencefile="google-workspace-readiness-php${EXPECTED_RUNTIME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

          set +e
          php plugin/tests/fixtures/acceptance/check_environment.php \
            --runtime="$EXPECTED_RUNTIME" \
            > "$evidencefile"
          readinessstatus=$?
          set -e

          php plugin/tests/fixtures/acceptance/validate_environment.php \
            "$evidencefile"
          echo "evidence_file=$evidencefile" >> "$GITHUB_OUTPUT"
          echo "readiness_status=$readinessstatus" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-workspace-readiness-php${{ matrix.php_runtime }}-${{ github.run_id }}
          path: ${{ steps.inspect.outputs.evidence_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Apply readiness result
        env:
          READINESS_STATUS: ${{ steps.inspect.outputs.readiness_status }}
        run: exit "$READINESS_STATUS"
